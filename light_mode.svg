<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490" fill="none" xml:space="preserve" role="img" aria-label="SHoussam terminal profile card">
  <style>
    .win  { fill: #e1e2e7; stroke: #b7bac9; }
    .bar  { fill: #d5d6db; }
    .barline { stroke: #b7bac9; }
    text  { font-family: 'JetBrains Mono','Fira Code','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace; font-size: 17px; }
    .title { fill: #6c7086; font-size: 14px; }
    .sub   { fill: #6c7086; font-size: 15.5px; }
    .prompt { fill: #587539; }
    .path   { fill: #007197; }
    .cmd    { fill: #3760bf; }
    .out    { fill: #3760bf; }
    .accent { fill: #9854f1; }
    .key    { fill: #2e7de9; }
    .str    { fill: #587539; }
    .num    { fill: #b15c00; }
    .punct  { fill: #8990b3; }

    .line { clip-path: inset(0 101% 0 0); animation: type 0.45s steps(32) forwards; }
    .l1  { animation-delay: 0.30s; }
    .l2  { animation-delay: 0.80s; }
    .l3  { animation-delay: 1.25s; }
    .l4  { animation-delay: 1.75s; }
    .l5  { animation-delay: 2.25s; }
    .l6  { animation-delay: 2.65s; }
    .l7  { animation-delay: 3.05s; }
    .l8  { animation-delay: 3.45s; }
    .l9  { animation-delay: 3.85s; }
    .l10 { animation-delay: 4.25s; }
    .l11 { animation-delay: 4.65s; }
    .l12 { animation-delay: 5.05s; }
    .l13 { animation-delay: 5.45s; }

    @keyframes type { to { clip-path: inset(0 0 0 0); } }

    .caret { fill: #007197; opacity: 0; animation: blink 1.05s steps(1) 5.90s infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .card { opacity: 0; animation: fade 0.5s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
  </style>

