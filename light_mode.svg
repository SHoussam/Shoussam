    <g class="line l11"><text y="394"><tspan class="key" x="60">"ai_tools"</tspan><tspan class="punct" x="176">:</tspan><tspan class="punct" x="196">[</tspan><tspan class="str">"Multi-Agent","MCP","LLM Routing","Typer","uv"</tspan><tspan class="punct">]</tspan></text></g>
    <g class="line l12"><text y="424"><tspan class="punct" x="36">}</tspan></text></g>

    <g class="line l13"><text x="36" y="460"><tspan class="prompt">➜</tspan><tspan class="path">  ~  </tspan></text></g>
    <rect class="caret" x="100" y="446" width="10" height="18" rx="1"/>
  </g>
</svg>
