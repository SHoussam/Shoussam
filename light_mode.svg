    <g class="line l6"><text y="244"><tspan class="key" x="60">"backend"</tspan><tspan class="punct" x="176">:</tspan><tspan class="punct" x="196">[</tspan><tspan class="str">"Java 21","Spring Boot 3","FastAPI","Laravel"</tspan><tspan class="punct">],</tspan></text></g>
    <g class="line l7"><text y="274"><tspan class="key" x="60">"security"</tspan><tspan class="punct" x="176">:</tspan><tspan class="punct" x="196">[</tspan><tspan class="str">"Keycloak","RBAC","JWT","Sanctum","Multi-Tenant"</tspan><tspan class="punct">],</tspan></text></g>
